name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: firefirst
          POSTGRES_PASSWORD: firefirst
          POSTGRES_DB: firefirst
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://firefirst:firefirst@localhost:5432/firefirst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is up to date (the mobile app's client is generated from it)
        run: |
          python manage.py spectacular --fail-on-warn --file /tmp/schema.yml
          diff -u openapi.yml /tmp/schema.yml
      - run: pytest
