          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApparatusRequest'
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apparatus'
          description: ''
    delete:
      operationId: api_v1_apparatus_destroy
      description: ModelViewSet scoped to ``request.user.department``.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this apparatus.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/apparatus/{id}/checklists/:
    get:
      operationId: api_v1_apparatus_checklists_list
      description: Active checklists that can be used for this apparatus.
      parameters:
      - in: query
        name: apparatus_type
        schema:
          type: string
          enum:
          - ambulance
          - brush
          - command
          - engine
          - hazmat
          - ladder
          - other
          - quint
          - rescue
          - tender
          - utility
        description: |-
          * `engine` - Engine
          * `ladder` - Ladder / Truck
          * `quint` - Quint
          * `rescue` - Rescue / Squad
          * `ambulance` - Ambulance / Medic
          * `brush` - Brush
          * `tender` - Tender / Tanker
          * `hazmat` - Hazmat
          * `command` - Command / Staff
          * `utility` - Utility
          * `other` - Other
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this apparatus.
        required: true
      - name: ordering
        required: false
