          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApparatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApparatusRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
