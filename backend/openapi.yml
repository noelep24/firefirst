components:
  schemas:
    Apparatus:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        id:
          type: integer
          readOnly: true
        unit_number:
          type: string
          maxLength: 30
        apparatus_type:
          $ref: '#/components/schemas/ApparatusTypeEnum'
        station:
          type: integer
          nullable: true
        station_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ApparatusStatusEnum'
        make:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 80
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        vin:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 2147483647
          minimum: 0
        engine_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,1})?$
        notes:
          type: string
        open_work_orders:
          type: integer
          readOnly: true
        current_move:
          allOf:
          - $ref: '#/components/schemas/ApparatusMove'
          nullable: true
          readOnly: true
          description: Where the rig is temporarily, if it's away today
      required:
      - apparatus_type
      - current_move
      - id
      - open_work_orders
      - station_name
      - unit_number
    ApparatusMove:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        station:
          type: integer
        station_name:
          type: string
          readOnly: true
        starts_on:
          type: string
          format: date
        ends_on:
          type: string
          format: date
          nullable: true
          description: Last day away; blank until it's returned
        covering_for:
          type: integer
          nullable: true
          description: A rig out of service whose crew rides this one meanwhile
        covering_for_unit:
          type: string
          readOnly: true
        crew_moves:
          type: boolean
          description: The rig's own crew goes with it (otherwise they stay at their
            station)
        reason:
          type: string
          maxLength: 200
      required:
      - covering_for_unit
      - id
      - starts_on
      - station
      - station_name
    ApparatusRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        unit_number:
          type: string
          minLength: 1
          maxLength: 30
        apparatus_type:
          $ref: '#/components/schemas/ApparatusTypeEnum'
        station:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/ApparatusStatusEnum'
        make:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 80
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        vin:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 2147483647
          minimum: 0
        engine_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,1})?$
        notes:
          type: string
      required:
      - apparatus_type
      - unit_number
    ApparatusStatusEnum:
      enum:
      - in_service
      - limited
      - out_of_service
      - reserve
      type: string
      description: |-
        * `in_service` - In service
        * `limited` - In service – limited
        * `out_of_service` - Out of service
        * `reserve` - Reserve
    ApparatusTypeEnum:
      enum:
      - engine
      - ladder
      - quint
      - rescue
      - ambulance
      - brush
      - tender
      - hazmat
      - command
      - utility
      - other
      type: string
      description: |-
        * `engine` - Engine
        * `ladder` - Ladder / Truck
        * `quint` - Quint
        * `rescue` - Rescue / Squad
        * `ambulance` - Ambulance / Medic
        * `brush` - Brush
        * `tender` - Tender / Tanker
        * `hazmat` - Hazmat
        * `command` - Command / Staff
        * `utility` - Utility
        * `other` - Other
    Assignment:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        platoon:
          type: integer
        station:
          type: integer
          nullable: true
        station_name:
          type: string
          readOnly: true
        position:
          $ref: '#/components/schemas/PositionEnum'
        apparatus:
          type: integer
          nullable: true
          description: The rig this member rides
        apparatus_unit:
          type: string
          readOnly: true
      required:
      - apparatus_unit
      - id
      - platoon
      - station_name
      - user
      - user_name
    AssignmentRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        user:
          type: integer
        platoon:
          type: integer
        station:
          type: integer
          nullable: true
        position:
          $ref: '#/components/schemas/PositionEnum'
        apparatus:
          type: integer
          nullable: true
          description: The rig this member rides
      required:
      - platoon
      - user
    Attendance:
      type: object
      properties:
        user:
          type: integer
        user_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
      required:
      - user
      - user_name
    AttendanceMarkRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        attended:
          type: array
          items:
            type: integer
        absent:
          type: array
          items:
            type: integer
    AttendanceRequest:
      type: object
      properties:
        user:
          type: integer
        status:
          $ref: '#/components/schemas/AttendanceStatusEnum'
      required:
      - user
    AttendanceStatusEnum:
      enum:
      - invited
      - going
      - declined
      - attended
      - absent
      type: string
      description: |-
        * `invited` - Invited
        * `going` - Going
        * `declined` - Declined
        * `attended` - Attended
        * `absent` - Absent
    AudienceEnum:
      enum:
      - officers
      - admins
      - nobody
      type: string
      description: |-
        * `officers` - Officers and admins
        * `admins` - Admins only
        * `nobody` - Only the extra addresses
