        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: station
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_service
          - limited
          - out_of_service
          - reserve
        description: |-
          * `in_service` - In service
