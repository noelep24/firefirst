  /api/v1/audit-log/:
    get:
      operationId: api_v1_audit_log_list
      description: Who changed what. Department admins only.
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - update
        description: |-
          * `create` - Created
          * `update` - Updated
          * `delete` - Deleted
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: On or before this date
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
