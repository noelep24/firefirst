openapi: 3.0.3
info:
  title: FireFirst API
  version: 0.1.0
  description: 'Fire department station administration: inventory, apparatus, scheduling
    and events.'
paths:
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/apparatus/:
    get:
      operationId: v1_apparatus_list
      description: ModelViewSet scoped to ``request.user.department``.
      parameters:
      - in: query
        name: apparatus_type
        schema:
          type: string
          enum:
          - ambulance
          - brush
          - command
          - engine
          - hazmat
          - ladder
          - other
          - quint
          - rescue
          - tender
          - utility
        description: |-
          * `engine` - Engine
          * `ladder` - Ladder / Truck
          * `quint` - Quint
          * `rescue` - Rescue / Squad
          * `ambulance` - Ambulance / Medic
          * `brush` - Brush
          * `tender` - Tender / Tanker
          * `hazmat` - Hazmat
          * `command` - Command / Staff
          * `utility` - Utility
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: station
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_service
          - limited
          - out_of_service
          - reserve
        description: |-
          * `in_service` - In service
          * `limited` - In service – limited
          * `out_of_service` - Out of service
          * `reserve` - Reserve
      tags:
      - v1
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApparatusList'
          description: ''
    post:
      operationId: v1_apparatus_create
      description: ModelViewSet scoped to ``request.user.department``.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApparatusRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApparatusRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApparatusRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apparatus'
          description: ''
  /api/v1/apparatus/{id}/:
    get:
      operationId: v1_apparatus_retrieve
      description: ModelViewSet scoped to ``request.user.department``.
      parameters:
      - in: path
