      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - accepted
          - declined
          - expired
          - pending
          - withdrawn
        description: |-
          * `pending` - Waiting for an answer
          * `accepted` - Volunteered
          * `declined` - Turned down
          * `expired` - No answer
          * `withdrawn` - No longer needed
