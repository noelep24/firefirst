          - tender
          - utility
        description: |-
          * `engine` - Engine
          * `ladder` - Ladder / Truck
          * `quint` - Quint
          * `rescue` - Rescue / Squad
          * `ambulance` - Ambulance / Medic
          * `brush` - Brush
          * `tender` - Tender / Tanker
          * `hazmat` - Hazmat
          * `command` - Command / Staff
          * `utility` - Utility
          * `other` - Other
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this apparatus.
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: station
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - in_service
          - limited
          - out_of_service
          - reserve
        description: |-
          * `in_service` - In service
          * `limited` - In service – limited
