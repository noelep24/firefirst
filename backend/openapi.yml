components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - Created
        * `update` - Updated
        * `delete` - Deleted
    Apparatus:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        id:
          type: integer
          readOnly: true
        unit_number:
          type: string
          maxLength: 30
        apparatus_type:
          $ref: '#/components/schemas/ApparatusTypeEnum'
        station:
          type: integer
          nullable: true
        station_name:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ApparatusStatusEnum'
        make:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 80
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        vin:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 2147483647
          minimum: 0
        engine_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,1})?$
        notes:
          type: string
        open_work_orders:
          type: integer
          readOnly: true
      required:
      - apparatus_type
      - id
      - open_work_orders
      - station_name
      - unit_number
    ApparatusRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        unit_number:
          type: string
          minLength: 1
          maxLength: 30
        apparatus_type:
          $ref: '#/components/schemas/ApparatusTypeEnum'
        station:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/ApparatusStatusEnum'
        make:
          type: string
          maxLength: 80
        model:
          type: string
          maxLength: 80
        year:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        vin:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 2147483647
          minimum: 0
        engine_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,1})?$
        notes:
          type: string
      required:
