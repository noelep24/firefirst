          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        vin:
          type: string
          maxLength: 32
        license_plate:
          type: string
          maxLength: 20
        mileage:
          type: integer
          maximum: 2147483647
          minimum: 0
        engine_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,1})?$
        notes:
          type: string
    PatchedAssignmentRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        user:
          type: integer
        platoon:
          type: integer
        station:
          type: integer
          nullable: true
        position:
          $ref: '#/components/schemas/PositionEnum'
        apparatus:
          type: integer
          nullable: true
          description: The rig this member rides
    PatchedCertificationRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        user:
          type: integer
        certification_type:
          type: integer
        number:
          type: string
          title: Certificate number
          maxLength: 60
        issued_on:
          type: string
          format: date
          nullable: true
        expires_on:
          type: string
          format: date
          nullable: true
          description: Leave blank to use the type's renewal period, or if it doesn't
            expire
        notes:
          type: string
          maxLength: 255
    PatchedCertificationTypeRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        code:
          type: string
          description: Short label, e.g. EMT-B, FF2
          maxLength: 20
        renewal_months:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Fills in the expiration from the issue date when none is given
        required_for_all:
          type: boolean
          description: Every active member must hold it
        notes:
          type: string
    PatchedChecklistTemplateRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        apparatus_type:
          description: |-
            Leave blank to offer this checklist for every apparatus type.

            * `engine` - Engine
            * `ladder` - Ladder / Truck
            * `quint` - Quint
            * `rescue` - Rescue / Squad
            * `ambulance` - Ambulance / Medic
            * `brush` - Brush
            * `tender` - Tender / Tanker
            * `hazmat` - Hazmat
            * `command` - Command / Staff
            * `utility` - Utility
            * `other` - Other
          oneOf:
          - $ref: '#/components/schemas/ApparatusTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        is_active:
          type: boolean
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItemRequest'
    PatchedDepartmentRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        timezone:
          type: string
          minLength: 1
          maxLength: 64
        neris_id:
          type: string
          description: The department's NERIS ID, e.g. FD12345678
          maxLength: 10
        logo:
          type: string
          writeOnly: true
    PatchedEventRequest:
      type: object
      description: Restricts every related-field choice to the requesting user's department.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        category:
          $ref: '#/components/schemas/EventCategoryEnum'
        station:
          type: integer
          nullable: true
          description: Leave blank for department-wide events
        location:
          type: string
          maxLength: 200
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        all_day:
          type: boolean
        is_mandatory:
          type: boolean
        training_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
          description: Credit hours awarded to attendees (training and drills)
        invitees:
          type: array
          items:
            type: integer
            writeOnly: true
          writeOnly: true
          description: Members to invite. Mandatory events invite every active member
            automatically.
        repeat:
          allOf:
          - $ref: '#/components/schemas/RepeatEnum'
          writeOnly: true
          default: none
          description: |-
            Only when creating

            * `none` - Doesn't repeat
            * `weekly` - Weekly
            * `monthly_date` - Monthly on the same date
            * `monthly_weekday` - Monthly on the same weekday (e.g. 2nd Tuesday)
        repeat_interval:
          type: integer
          maximum: 12
          minimum: 1
          writeOnly: true
          default: 1
          description: Every N weeks or months
        repeat_until:
          type: string
          format: date
          writeOnly: true
          nullable: true
        repeat_count:
          type: integer
          maximum: 104
          minimum: 2
          writeOnly: true
          nullable: true
